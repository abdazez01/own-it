<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>own-it</title>
<link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="engine/tokens.css">
<link rel="stylesheet" href="engine/ui.css">
</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<div id="stage"></div>
<noscript><p style="padding:24px">own-it needs JavaScript to run.</p></noscript>

<script src="engine/z.js"></script>
<script src="engine/icons.js"></script>
<script src="engine/router.js"></script>
<script src="engine/flap.js"></script>
<script src="engine/toggle.js"></script>
<script src="engine/juice.js"></script>
<script src="engine/keys.js"></script>
<script src="engine/link.js"></script>
<script src="engine/shell.js"></script>
<script src="engine/home.js"></script>
<script src="engine/gamekit.js"></script>
<script src="engine/screenhost.js"></script>
<script src="engine/music.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/field.js"></script>
<!-- Game templates register themselves here (games/<id>.js). Tasks 11 to 14 add them. -->
<script src="core.js"></script>
<script src="games/registry.js"></script>
<script src="games/quiz.js"></script>
<script src="games/screen-tour.js"></script>
<script src="games/guess-the-screen.js"></script>
<script src="games/quests.js"></script>
<script src="games/whiteboard.js"></script>
<script src="games/boss-battle.js"></script>
<script src="games/memory-match.js"></script>
<script src="games/spot-the-lie.js"></script>
<script src="games/chain-reaction.js"></script>
<script src="games/whos-allowed.js"></script>
<script src="games/blast-radius.js"></script>
<script src="games/pager.js"></script>
<script src="games/data-detective.js"></script>
<script src="games/pipe-plumber.js"></script>
<script src="games/what-if.js"></script>
<script src="progress.js"></script>
<script src="recs.js"></script>
<script src="rounds.js"></script>
<script src="feedback.js"></script>
<script src="screens.js"></script>
<script>
(function () {
  'use strict';
  var OwnIt = window.OwnIt;
  OwnIt.field.start(document.getElementById('field'));
  OwnIt.router.go('home');
  // Live mode: when Claude rewrites progress.js, recs.js or a data file, redraw Home in place.
  OwnIt.link.onData(function () {
    if (OwnIt.router.current() === 'home' && !document.querySelector('.building')) OwnIt.router.go('home');
  });
})();
</script>
</body>
</html>
