<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>own-it</title>
<style>
:root {
  --paper: #F1F4F7; --grid: #DCE3EA; --surface: #FFFFFF; --sunk: #E6EBF0;
  --ink: #1D2935; --muted: #5A6A7A; --line: #C5CED7;
  --accent: #2457D6; --accent-soft: #DCE6FB; --on-accent: #FFFFFF;
  --good: #1B7A44; --good-soft: #DDF1E5; --bad: #BF3328; --bad-soft: #FBE2DF;
  --note: #FFE57A; --note-ink: #3B3300;
  --shadow: #1D2935;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1A2129; --grid: #26313C; --surface: #222C37; --sunk: #1E2730;
    --ink: #E2E9F0; --muted: #98A8B7; --line: #3A4757;
    --accent: #82A8FF; --accent-soft: #263A63; --on-accent: #0D1830;
    --good: #5CC98B; --good-soft: #1D3A2B; --bad: #FF8378; --bad-soft: #45231F;
    --note: #E7CD5E; --note-ink: #2A2300; --shadow: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; font-size: 12.5px; }
[hidden] { display: none !important; }

.btn {
  min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: var(--radius);
  border: 2px solid var(--ink); background: var(--surface); color: var(--ink);
  font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover:not(:disabled) { background: var(--sunk); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn.quiet { border-color: var(--line); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 0 12px; font-size: 13px; }

/* ---------- narrow notice ---------- */
#narrow { display: none; padding: 48px 24px; max-width: 520px; margin: 0 auto; }
@media (max-width: 1023px) { #narrow { display: block; } #app { display: none; } }

/* ---------- map screen ---------- */
#map-screen { max-width: 1240px; margin: 0 auto; padding: 28px 32px 48px; }
.top { display: flex; align-items: center; gap: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--ink); }
.wordmark { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.wordmark span { color: var(--accent); }
.top .sub { color: var(--muted); margin: 0; flex: 1; }
.stat { display: flex; flex-direction: column; align-items: flex-end; }
.stat b { font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); }
.map-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 40px; margin-top: 28px; }
.map-grid h2 { font-size: 18px; margin: 0 0 14px; }
.zones { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
.zone {
  background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius);
  box-shadow: 4px 4px 0 var(--line); padding: 16px 18px;
}
.zone.fogged { border-style: dashed; }
.zone h3 { margin: 0; font-size: 17px; }
.zone .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--muted); }
.fog { color: var(--ink); background: var(--sunk); border-radius: 4px; padding: 0 6px; }
.ladder { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 16px; list-style: none; padding: 0; }
.ladder li { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); position: relative; }
.ladder li + li::before { content: ""; position: absolute; top: 11px; right: 50%; width: 100%; height: 2px; background: var(--line); z-index: 0; }
.pip { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); position: relative; z-index: 1;
  display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.pip.open { border-color: var(--accent); }
.pip.cleared { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pip.locked { border-style: dashed; }
.ladder li.is-cleared, .ladder li.is-open { color: var(--ink); }
.missions { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.mission { display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.mission .what { flex: 1; min-width: 0; }
.mission .what b { display: block; }
.mission .what p { margin: 2px 0 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.status.sent { background: var(--good-soft); color: var(--good); }
.empty { border: 2px dashed var(--line); border-radius: var(--radius); padding: 24px; color: var(--muted); }
.ledger { margin-top: 28px; }
.ledger dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; margin: 0; }
.ledger dt { color: var(--muted); }
.ledger dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }
.mode-tag { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 6px; }

/* ---------- board screen ---------- */
#board-screen { height: 100vh; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 2px solid var(--ink); background: var(--surface); }
.bar .brief { flex: 1; min-width: 0; }
.bar .brief b { font-size: 13px; color: var(--muted); font-weight: 600; }
.bar .brief p { margin: 0; font-size: 16px; font-weight: 600; }
.bar .actions { display: flex; gap: 10px; }
.hintline { display: flex; gap: 12px; align-items: baseline; padding: 8px 16px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
.hintline small { color: var(--muted); font-style: italic; white-space: nowrap; }
.work { flex: 1; display: flex; min-height: 0; }
.side { width: 290px; flex: none; border-right: 2px solid var(--ink); background: var(--surface); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.side h2 { font-size: 15px; margin: 0 0 8px; }
.side p.how { margin: 0; font-size: 13.5px; color: var(--muted); }
.side .tray { display: flex; flex-direction: column; gap: 8px; min-height: 60px; border: 2px dashed var(--line); border-radius: var(--radius); padding: 8px; }
.side .tray.drop { border-color: var(--accent); }
.status-line { font-size: 13px; color: var(--accent); min-height: 20px; margin: 0; }
#canvas { flex: 1; position: relative; overflow: hidden; touch-action: none; }
#ink { position: absolute; inset: 0; width: 100%; height: 100%; }
#ink .edge-hit { stroke: transparent; stroke-width: 16; fill: none; cursor: pointer; pointer-events: stroke; }
#ink .edge-hit:focus { outline: none; }
#ink .edge { fill: none; stroke: var(--ink); stroke-width: 2.25; stroke-linecap: round; pointer-events: none; }
#ink .edge.sel { stroke: var(--accent); stroke-width: 3.25; }
#ink .edge.ok { stroke: var(--good); stroke-width: 3; }
#ink .edge.bad { stroke: var(--bad); stroke-width: 2.5; opacity: .85; }
#ink .edge.ghost { stroke: var(--bad); stroke-dasharray: 7 6; stroke-width: 2.25; }
#ink .edge.context { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 5; }
#ink .edge.temp { stroke: var(--accent); stroke-dasharray: 5 5; }
#ink .cross { stroke: var(--bad); stroke-width: 3; stroke-linecap: round; }
#ink .lane-band { fill: var(--sunk); opacity: .55; }
#ink .lane-rule { stroke: var(--ink); stroke-width: 1.5; }
#ink .lane-name { fill: var(--ink); font-weight: 700; font-size: 14px; }
.edge-x { position: absolute; width: 32px; height: 32px; min-width: 0; padding: 0; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; }
.edge-x::after { content: ""; position: absolute; inset: -6px; }

.node {
  position: absolute; width: 196px; background: var(--surface); color: var(--ink);
  border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: 3px 3px 0 var(--shadow);
  padding: 10px 26px 10px 12px; cursor: grab; user-select: none; z-index: 2;
}
.lanes-board .node { width: 176px; }
.node.noted { z-index: 7; }
.node.dragging { cursor: grabbing; box-shadow: 6px 6px 0 var(--shadow); z-index: 4; }
.node.target { outline: 3px dashed var(--accent); outline-offset: 3px; }
.node .label { font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.node .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.chip-unverified { font-size: 11.5px; font-weight: 600; border: 1px dashed var(--muted); color: var(--muted); border-radius: 4px; padding: 0 5px; cursor: help; }
.peek { position: relative; min-height: 28px; font-size: 12px; padding: 0 8px; border: 1px solid var(--line); background: transparent; border-radius: 4px; cursor: pointer; color: var(--muted); }
.peek::after, .node .chip::after { content: ""; position: absolute; inset: -8px; }
.ref { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ref a { color: var(--accent); font-weight: 600; }
.pin {
  position: absolute; top: -14px; right: -14px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--note); color: var(--note-ink); border: 2px solid var(--ink); font-weight: 800; cursor: pointer; padding: 0;
}
.pin::after { content: ""; position: absolute; inset: -8px; }
.handle {
  position: absolute; right: -13px; top: 50%; width: 24px; height: 24px; margin-top: -12px; padding: 0;
  border-radius: 50%; border: 2px solid var(--ink); background: var(--accent); cursor: crosshair;
}
.handle::after { content: ""; position: absolute; inset: -10px; }
.note {
  position: absolute; left: calc(100% + 18px); top: -6px; width: 230px; background: var(--note); color: var(--note-ink);
  padding: 10px; border-radius: 2px; box-shadow: 3px 4px 0 rgba(0,0,0,.18); transform: rotate(-1deg); z-index: 6; cursor: default;
}
.tray .note { position: static; width: auto; transform: none; margin-top: 8px; box-shadow: none; }
.note p { margin: 0 0 6px; font-size: 13.5px; font-weight: 600; }
.note textarea, .side textarea {
  width: 100%; min-height: 74px; resize: vertical; border: 1px solid rgba(0,0,0,.25); border-radius: 4px; padding: 6px; background: rgba(255,255,255,.55); color: inherit;
}
.side textarea { background: var(--paper); border-color: var(--line); }
.tokens-on { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.chip {
  display: inline-flex; align-items: center; min-height: 32px; padding: 4px 10px; border-radius: 16px; font-size: 13px; font-weight: 600;
  background: var(--bad-soft); color: var(--ink); border: 2px solid var(--bad); cursor: grab; text-align: left; line-height: 1.25; position: relative;
}
.side .chip { min-height: 44px; width: 100%; border-radius: var(--radius); }
.chip.placed { opacity: .55; }
.chip.ok { background: var(--good-soft); border-color: var(--good); }
.chip.wrong { text-decoration: line-through; }
.chip.ghost { background: transparent; border-style: dashed; cursor: default; }
.floating { position: fixed; z-index: 50; pointer-events: none; opacity: .92; transform: rotate(-2deg); }
.tray .node, .floating.node { position: relative; left: auto; top: auto; width: 100%; }
.floating.node { position: fixed; }
.threat { display: flex; flex-direction: column; gap: 6px; }
.threat small { color: var(--muted); }
.addbox { display: flex; gap: 8px; }
.addbox input { flex: 1; min-width: 0; min-height: 44px; padding: 0 10px; border: 2px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.palette button { min-height: 44px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper); padding: 2px 8px; cursor: pointer; font-size: 13px; }
.question p { margin: 0 0 6px; font-size: 13.5px; font-weight: 600; }

/* reveal states on nodes */
.node.ok { border-color: var(--good); box-shadow: 3px 3px 0 var(--good); }
.node.half { border-color: var(--good); box-shadow: 3px 3px 0 var(--good); border-style: dotted; }
.node.miss { border-color: var(--bad); border-style: dashed; box-shadow: none; }
.node.wrongbox { border-color: var(--bad); box-shadow: 3px 3px 0 var(--bad); }
.node.wrongbox .label { text-decoration: line-through; text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.verdict { display: block; margin-top: 6px; font-size: 12.5px; font-weight: 600; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.revealed .node { cursor: default; }

/* reveal panel */
.stamp {
  align-self: flex-start; margin: 6px 0 0 4px; border: 3px solid var(--accent); color: var(--accent); border-radius: 8px; padding: 4px 16px 6px;
  transform: rotate(-3deg); font-weight: 800; font-size: 36px; line-height: 1.1; font-variant-numeric: tabular-nums;
  animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both;
}
.stamp small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
@keyframes stamp { from { transform: rotate(-12deg) scale(1.8); opacity: 0; } to { transform: rotate(-3deg) scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.items li { border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.items li.missed { border-left: 4px dashed var(--bad); }
.items li.wrong { border-left: 4px solid var(--bad); }
.items .ref { margin: 0; }
.saved { background: var(--accent-soft); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.saved p { margin: 0; }
.copybox { width: 100%; min-height: 60px; font-size: 11px; }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); display: grid; place-items: center; z-index: 100; }
.modal { background: var(--surface); border: 2px solid var(--ink); border-radius: var(--radius); box-shadow: 6px 6px 0 var(--shadow); padding: 22px; width: 380px; }
.modal h2 { margin: 0 0 6px; font-size: 18px; }
.modal p { margin: 0 0 18px; color: var(--muted); }
.modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div id="narrow">
  <p class="wordmark">own<span>-</span>it</p>
  <p>The whiteboard needs a window at least 1024 pixels wide. Widen this window or open the page on a larger screen.</p>
</div>
<div id="app">
  <main id="map-screen"></main>
  <section id="board-screen" hidden></section>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<script src="core.js"></script>
<script src="progress.js"></script>
<script src="mission.js"></script>
<script>
(function () {
  'use strict';

  var Core = window.OwnItCore || null;
  var DATA = window.OWNIT_MISSIONS && typeof window.OWNIT_MISSIONS === 'object' ? window.OWNIT_MISSIONS : null;
  var PROG = window.OWNIT_PROGRESS && typeof window.OWNIT_PROGRESS === 'object' ? window.OWNIT_PROGRESS : null;
  var MISSIONS = DATA && Array.isArray(DATA.missions) && Core ? DATA.missions : [];
  var EXAM = !!DATA && DATA.mode === 'exam';
  var ROOT = DATA && typeof DATA.root === 'string' ? DATA.root : '';
  var RUNGS = ['words', 'map', 'trace', 'break', 'boss'];
  var RUNG_NAME = { words: 'Words', map: 'Map', trace: 'Trace', break: 'Break', boss: 'Boss' };
  var KIND_HOW = {
    map: 'Drag a card to move it. Drag from the blue dot on a card to another card to draw an arrow for "calls" or "sends to". Click an arrow to select it, then press Delete or use its × to remove it. Keyboard: arrow keys move a focused card; Enter on one card then Enter on another draws an arrow.',
    boss: 'Add a box for every screen, route and service you remember, then connect them with arrows from the blue dot. Boxes are matched to the code by their wording, so name them the way the app does. Delete removes a focused box.',
    lanes: 'Drag each card from the tray into the lane that runs it. Left to right is the order things happen. Cards side by side in one step can go in either order. Keyboard: Enter puts a tray card on the board, arrow keys move it, Delete sends it back.',
    break: 'Drag each threat onto the part of the system it attacks, then explain it below. Keyboard: Enter on a threat, then Enter on a card.'
  };
  var LANE_LABEL_W = 130;
  var STEP = 16;

  var boards = {};          // missionId -> board state, kept for this page session only
  var B = null;             // board being played
  var canvas = null;

  // ---------- small helpers ----------
  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'text') n.textContent = v;
      else if (k === 'class') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, '');
      else n.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) append(n, arguments[i]);
    return n;
  }
  function append(n, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) kid.forEach(function (k) { append(n, k); });
    else n.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    // Ink is decorative except focusable arrows (role=button) and lane names.
    if (tag !== 'svg' && tag !== 'text' && !(attrs && attrs.role)) n.setAttribute('aria-hidden', 'true');
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    return n;
  }
  function say(msg) {
    var live = $('#live');
    live.textContent = '';
    setTimeout(function () { live.textContent = msg; }, 30);
    var line = $('#status-line');
    if (line) line.textContent = msg;
  }
  function fmt(n) { return Math.round(n * 10) / 10 + ''; }
  function num(n) { return Math.round(n).toLocaleString('en-US'); }
  function q(s) { return '“' + s + '”'; }
  function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { return function () { seed = (seed + 0x6D2B79F5) >>> 0; var t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function shuffled(arr, rand) { var a = arr.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rand() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function refParts(ref) { var i = String(ref || '').lastIndexOf(':'); return i < 0 ? null : { path: ref.slice(0, i), line: ref.slice(i + 1) }; }
  function refView(ref) {
    var p = refParts(ref);
    if (!p) return null;
    var full = (ROOT ? ROOT.replace(/\/+$/, '') + '/' : '') + p.path;
    var path = full.replace(/^\/+/, '').split('/').map(function (seg) { return /^[A-Za-z]:$/.test(seg) ? seg : encodeURIComponent(seg); }).join('/');
    var href = 'vscode://file/' + path + ':' + p.line;
    return el('span', { class: 'ref' }, el('a', { href: href, title: 'Open in VS Code' }, 'Open in editor'), ' ', el('code', { text: p.path + ':' + p.line }));
  }
  function kindOf(m) {
    if (m.blank) return 'boss';
    if (m.board === 'swimlanes') return 'lanes';
    if (m.rung === 'break' || (m.tokens && m.tokens.length)) return 'break';
    return 'map';
  }

  // ---------- modal ----------
  function confirmBox(title, body, okText) {
    return new Promise(function (resolve) {
      var prev = document.activeElement;
      function close(v) { scrim.remove(); document.removeEventListener('keydown', key, true); if (prev && prev.focus) prev.focus(); resolve(v); }
      function key(e) { if (e.key === 'Escape') { e.stopPropagation(); close(false); } }
      var ok = el('button', { class: 'btn primary', onclick: function () { close(true); } }, okText);
      var scrim = el('div', { class: 'scrim', onclick: function (e) { if (e.target === scrim) close(false); } },
        el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'modal-title' },
          el('h2', { id: 'modal-title', text: title }), el('p', { text: body }),
          el('div', { class: 'actions' }, el('button', { class: 'btn quiet', onclick: function () { close(false); } }, 'Cancel'), ok)));
      document.body.appendChild(scrim);
      document.addEventListener('keydown', key, true);
      ok.focus();
    });
  }

  // ---------- map screen ----------
  function lastSessionTokens(tokens) {
    var missions = tokens.filter(function (t) { return t && t.kind === 'mission' && typeof t.t === 'string'; });
    if (!missions.length) return null;
    var day = missions.map(function (t) { return t.t.slice(0, 10); }).sort().pop();
    var same = missions.filter(function (t) { return t.t.slice(0, 10) === day; });

  }

  function dropTrayCard(n, pt, moved) {
    if (!moved) { autoPlace(n); return; }
    if (!overCanvas(pt.x, pt.y)) return;
    var cr = canvas.getBoundingClientRect();
    n.placed = true;
    n.x = pt.left - cr.left; n.y = pt.top - cr.top;
    clampNode(n, null);
    noteLane(n, null);
    renderNodes(n.id);
    say(n.label + ' placed in the ' + laneAt(n) + ' lane.');
  }

  function autoPlace(n) {
    var right = LANE_LABEL_W + 16;
    B.nodes.forEach(function (o) { if (o.placed && o !== n) right = Math.max(right, o.x + cardWidth() + 16); });
    n.placed = true;
    n.x = right; n.y = laneHeight() / 2 - 35;
    clampNode(n, null);
    noteLane(n, null);
    renderNodes(n.id);
    say(n.label + ' placed in the ' + laneAt(n) + ' lane. Use the arrow keys to move it.');
  }

  function activateNode(n) {
    var p = B.pending;
    if (!p) return;
    if (p.type === 'connect') { if (p.from !== n.id) addEdge(p.from, n.id); else say('Arrow cancelled.'); B.pending = null; renderNodes(n.id); }
    else if (p.type === 'token') { placeToken(p.id, n.id); B.pending = null; }
  }

  function nodeKey(e, n, d, inTray) {
    if (e.target !== d || B.result) return;
    var k = e.key;
    if (inTray) {
      if (k === 'Enter' || k === ' ') { e.preventDefault(); autoPlace(n); }
      return;
    }
    var mv = { ArrowLeft: [-STEP, 0], ArrowRight: [STEP, 0], ArrowUp: [0, -STEP], ArrowDown: [0, STEP] }[k];
    if (mv) { e.preventDefault(); moveNode(n, d, n.x + mv[0], n.y + mv[1]); drawInk(); if (B.kind === 'lanes') say(n.label + ': ' + laneAt(n) + ' lane.'); return; }
    if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (B.pending) activateNode(n);
      else if (arrowsOn()) startConnect(n);
      return;
    }
    if ((k === 'Delete' || k === 'Backspace') && B.sel < 0) {
      if (n.box) {
        e.preventDefault();
        B.nodes = B.nodes.filter(function (o) { return o !== n; });
        B.edges = B.edges.filter(function (ed) { return ed[0] !== n.id && ed[1] !== n.id; });
        renderNodes();
        say('Removed box ' + q(n.label) + '.');
      } else if (B.kind === 'lanes') {
        e.preventDefault();
        n.placed = false;
        renderNodes();
        say(n.label + ' is back in the tray.');
      }
    }
  }

  // ---------- arrows ----------
  function startConnect(n) {
    B.pending = { type: 'connect', from: n.id };
    renderNodes(n.id);
    say('Drawing an arrow from ' + n.label + '. Choose the card it points to (click it, or focus it and press Enter). Escape cancels.');
  }
  function addEdge(a, b) {
    if (a === b) return;
    if (B.edges.some(function (e) { return e[0] === a && e[1] === b; })) { say('That arrow is already there.'); return; }
    B.edges.push([a, b]);
    B.sel = -1;
    say('Arrow drawn: ' + labelOf(a) + ' to ' + labelOf(b) + '.');
  }
  function removeEdge(i) {
    var e = B.edges[i];
    if (!e) return;
    B.edges.splice(i, 1);
    B.sel = -1;
    drawInk();
    say('Arrow removed: ' + labelOf(e[0]) + ' to ' + labelOf(e[1]) + '.');
    canvas.focus();
  }

  function handlePointerDown(e, n) {
    if (e.button !== 0 || B.result) return;
    e.preventDefault();
    e.stopPropagation();
    var h = e.currentTarget, moved = false, sx = e.clientX, sy = e.clientY;
    capture(h, e.pointerId);
    function move(ev) {
      if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 4) return;
      moved = true;
      var cr = canvas.getBoundingClientRect();
      B.temp = { from: n.id, x: ev.clientX - cr.left, y: ev.clientY - cr.top };
      drawInk();
    }
    function up(ev) {
      h.removeEventListener('pointermove', move);
      h.removeEventListener('pointerup', up);
      h.removeEventListener('pointercancel', up);
      B.temp = null;
      if (!moved) { startConnect(n); return; }
      var hit = document.elementFromPoint(ev.clientX, ev.clientY);
      var target = hit && hit.closest && hit.closest('#canvas .node');
      if (target && target.getAttribute('data-node') !== n.id) addEdge(n.id, target.getAttribute('data-node'));
      drawInk();
    }
    h.addEventListener('pointermove', move);
    h.addEventListener('pointerup', up);
    h.addEventListener('pointercancel', up);
  }

  function rectOf(id) {
    var d = nodeElById(id);
    return d ? { x: d.offsetLeft, y: d.offsetTop, w: d.offsetWidth, h: d.offsetHeight } : null;
  }
  function anchor(r, tx, ty) {
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = tx - cx, dy = ty - cy;
    if (!dx && !dy) return { x: cx, y: cy };
    var s = Math.min(dx ? (r.w / 2 + 7) / Math.abs(dx) : Infinity, dy ? (r.h / 2 + 7) / Math.abs(dy) : Infinity);
    return { x: cx + dx * s, y: cy + dy * s };
  }
  // Path from rect a to rect b; bend > 0 curves it so two-way pairs do not overlap.
  function arrowPath(a, b, bend) {
    var ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 }, bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    var nx = -(bc.y - ac.y), ny = bc.x - ac.x, len = Math.hypot(nx, ny) || 1;
    var mid = { x: (ac.x + bc.x) / 2 + nx / len * bend, y: (ac.y + bc.y) / 2 + ny / len * bend };
    var p1 = anchor(a, mid.x, mid.y), p2 = anchor(b, mid.x, mid.y);
    var c = { x: 2 * mid.x - (p1.x + p2.x) / 2, y: 2 * mid.y - (p1.y + p2.y) / 2 };
    return { d: 'M' + p1.x + ' ' + p1.y + ' Q' + c.x + ' ' + c.y + ' ' + p2.x + ' ' + p2.y, mid: mid };
  }

  function markerDefs(svg) {
    var defs = sv('defs');
    var pat = sv('pattern', { id: 'grid', width: 24, height: 24, patternUnits: 'userSpaceOnUse' });
    pat.appendChild(sv('path', { d: 'M24 0H0V24', fill: 'none', style: 'stroke:var(--grid)', 'stroke-width': 1 }));
    defs.appendChild(pat);
    [['ink', '--ink'], ['sel', '--accent'], ['ok', '--good'], ['bad', '--bad'], ['context', '--muted']].forEach(function (m) {
      var mk = sv('marker', { id: 'arrow-' + m[0], viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' });
      mk.appendChild(sv('path', { d: 'M0 0L10 5L0 10z', style: 'fill:var(' + m[1] + ')' }));
      defs.appendChild(mk);
    });
    svg.appendChild(defs);
  }

  function laneHeight() { var n = Math.max(1, (B.m.lanes || []).length); return canvas.clientHeight / n; }
  function laneIndex(n) {
    if (typeof n.lane === 'number') return n.lane;
    var lanes = B.m.lanes || [];
    var d = nodeElById(n.id), h = d ? d.offsetHeight : 70;
    var i = Math.floor((n.y + h / 2) / laneHeight());
    return Math.max(0, Math.min(lanes.length - 1, i));
  }
  function laneAt(n) { return (B.m.lanes || [])[laneIndex(n)] || ''; }

  function drawInk() {
    if (!canvas) return;
    var svg = $('#ink', canvas);
    svg.textContent = '';
    markerDefs(svg);
    svg.appendChild(sv('rect', { width: '100%', height: '100%', fill: 'url(#grid)' }));
    Array.prototype.slice.call(canvas.querySelectorAll('.edge-x')).forEach(function (x) { x.remove(); });

    if (B.kind === 'lanes') {
      var lanes = B.m.lanes || [], lh = laneHeight(), W = canvas.clientWidth;
      lanes.forEach(function (name, i) {
        if (i % 2 === 0) svg.appendChild(sv('rect', { class: 'lane-band', x: 0, y: i * lh, width: W, height: lh }));
        if (i > 0) svg.appendChild(sv('line', { class: 'lane-rule', x1: 0, x2: W, y1: i * lh, y2: i * lh }));
        svg.appendChild(sv('text', { class: 'lane-name', x: 14, y: i * lh + 26, text: name }));
      });
      svg.appendChild(sv('line', { class: 'lane-rule', x1: LANE_LABEL_W, x2: LANE_LABEL_W, y1: 0, y2: '100%' }));
    }

    var drawn = {};
    B.edges.concat(B.reveal ? B.reveal.ghosts : []).forEach(function (e) { drawn[e[0] + '\u0000' + e[1]] = true; });
    function line(from, to, cls, marker, extra) {
      var a = rectOf(from), b = rectOf(to);
      if (!a || !b) return null;
      var two = drawn[to + '\u0000' + from] && drawn[from + '\u0000' + to];
      var p = arrowPath(a, b, two ? 18 : 0);
      svg.appendChild(sv('path', { class: 'edge ' + cls, d: p.d, 'marker-end': 'url(#arrow-' + marker + ')' }));
      if (extra) extra(p);
      return p;
    }

    if (B.reveal) {
      (B.reveal.context || []).forEach(function (e) { line(e[0], e[1], 'context', 'context'); });
      B.edges.forEach(function (e) {
        var ok = B.reveal.edgeOk(e);
        line(e[0], e[1], ok ? 'ok' : 'bad', ok ? 'ok' : 'bad', ok ? null : function (p) {
          svg.appendChild(sv('path', { class: 'cross', d: 'M' + (p.mid.x - 8) + ' ' + (p.mid.y - 8) + 'L' + (p.mid.x + 8) + ' ' + (p.mid.y + 8) + 'M' + (p.mid.x + 8) + ' ' + (p.mid.y - 8) + 'L' + (p.mid.x - 8) + ' ' + (p.mid.y + 8) }));
        });
      });
      (B.reveal.ghosts || []).forEach(function (e) { line(e[0], e[1], 'ghost', 'bad'); });
      return;
    }

    B.edges.forEach(function (e, i) {
      var sel = i === B.sel;
      var p = line(e[0], e[1], sel ? 'sel' : '', sel ? 'sel' : 'ink');
      if (!p) return;
      var hit = sv('path', { class: 'edge-hit', d: p.d, tabindex: '0', role: 'button',
        'aria-label': 'Arrow from ' + labelOf(e[0]) + ' to ' + labelOf(e[1]) + '. Press Delete to remove.' });
      hit.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
      hit.addEventListener('click', function () { B.sel = i; drawInk(); });
      hit.addEventListener('focus', function () { if (B.sel !== i) { B.sel = i; drawInk(); var again = svg.querySelectorAll('.edge-hit')[i]; if (again) again.focus(); } });
      hit.addEventListener('keydown', function (ev) { if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); removeEdge(i); } });
      svg.appendChild(hit);
      if (sel) {
        var x = el('button', { class: 'btn edge-x', 'aria-label': 'Remove arrow', onclick: function () { removeEdge(i); } }, '×');
        x.style.left = p.mid.x + 'px'; x.style.top = p.mid.y + 'px';
        canvas.appendChild(x);
      }
    });
    if (B.temp) {
      var a = rectOf(B.temp.from);
      if (a) {
        var s = anchor(a, B.temp.x, B.temp.y);
        svg.appendChild(sv('path', { class: 'edge temp', d: 'M' + s.x + ' ' + s.y + 'L' + B.temp.x + ' ' + B.temp.y, 'marker-end': 'url(#arrow-sel)' }));
      }
    }
  }

  // ---------- break tokens ----------
  function pickToken(id) {
    B.pending = { type: 'token', id: id };
    var t = tokenById(id);
    say('Placing ' + q(t.label) + '. Choose a card: click it, or focus it and press Enter. Escape cancels.');
    var first = canvas.querySelector('.node');
    if (first) first.focus();
  }
  function tokenById(id) { return (B.m.tokens || []).filter(function (t) { return t.id === id; })[0]; }
  function placeToken(id, cardId) {
    B.tokens[id] = cardId;
    renderNodes(cardId);
    say(q(tokenById(id).label) + ' placed on ' + labelOf(cardId) + '. Explain it in the tray.');
  }
  function tokenPointerDown(e, id, chip) {
    if (B.result) return;
    e.stopPropagation();
    cloneDrag(e, chip, function (pt, moved) {
      if (!moved) { pickToken(id); return; }
      var hit = document.elementFromPoint(pt.x, pt.y);
      var card = hit && hit.closest && hit.closest('#canvas .node');
      if (card) placeToken(id, card.getAttribute('data-node'));
      else if (overSide(pt.x, pt.y)) { delete B.tokens[id]; renderNodes(); say(q(tokenById(id).label) + ' is back in the tray.'); }
    });
  }

  // ---------- hints ----------
  function placedForLanes() {
    return B.nodes.filter(function (n) { return n.placed; })
      .map(function (n) { var d = nodeElById(n.id); return { id: n.id, lane: laneAt(n), cx: n.x + (d ? d.offsetWidth : 176) / 2 }; })
      .sort(function (a, b) { return a.cx - b.cx; })
      .map(function (p) { return { id: p.id, lane: p.lane }; });
  }
  function boxList() { return B.nodes.filter(function (n) { return n.box; }).map(function (n) { return { uid: n.id, label: n.label }; }); }

  function buildHint(ans) {
    var has = function (a, b) { return B.edges.some(function (e) { return e[0] === a && e[1] === b; }); };
    if (B.kind === 'map') {
      var miss = (ans.edges || []).filter(function (e) { return !has(e.from, e.to); })[0];
      if (miss) return 'Try an arrow from ' + q(labelOf(miss.from)) + ' to ' + q(labelOf(miss.to)) + '.';
      if (B.edges.length > (ans.edges || []).length) return 'Every expected arrow is there. One or more of yours may be extra.';
    }
    if (B.kind === 'break') {
      var t = (ans.threats || []).filter(function (x) { return B.tokens[x.id] !== x.card; })[0];
      if (t) return q(tokenById(t.id).label) + ' attacks ' + q(labelOf(t.card)) + '.';
    }
    if (B.kind === 'lanes') {
      var r = Core.gradeSwimlanes(ans, placedForLanes());
      var stepOf = function (id) { for (var g = 0; g < ans.steps.length; g++) if (ans.steps[g].indexOf(id) >= 0) return g + 1; return 0; };
      if (r.missed.length) { var id = r.missed[0]; return q(labelOf(id)) + ' is step ' + stepOf(id) + ', in the ' + q(ans.lanes[id]) + ' lane.'; }
      var wrongLane = placedForLanes().filter(function (p) { return ans.lanes[p.id] !== p.lane; })[0];
      if (wrongLane) return q(labelOf(wrongLane.id)) + ' runs in the ' + q(ans.lanes[wrongLane.id]) + ' lane.';
    }
    if (B.kind === 'boss') {
      var map = Core.matchLabels(boxList(), ans.cards);
      var matched = {};
      Object.keys(map).forEach(function (u) { matched[map[u]] = u; });
      var lost = ans.cards.filter(function (c) { return !matched[c.id]; })[0];
      if (lost) return 'Add a box for ' + q(lost.label) + '.';
      var me = ans.edges.filter(function (e) { return !has(matched[e.from], matched[e.to]); })[0];
      var cardLabel = function (id) { var c = ans.cards.filter(function (x) { return x.id === id; })[0]; return c ? c.label : id; };
      if (me) return 'Connect ' + q(cardLabel(me.from)) + ' to ' + q(cardLabel(me.to)) + '.';
    }
    return 'Nothing obvious is missing. Check your work, then submit.';
  }

  function askHint() {
    if (EXAM || B.result) return;
    confirmBox('Use a hint?', 'Sure? Costs 15 XP.', 'Use hint').then(function (yes) {
      if (!yes) return;
      B.hintsUsed += 1;
      B.hint = buildHint(Core.decode(B.m.answer));
      renderBoardScreen();
      say('Hint: ' + B.hint);
    });
  }
  function showPalette() {
    if (EXAM || B.result) return;
    confirmBox('Show the card list?', 'Sure? Costs 15 XP. You will see the names of every box the answer expects.', 'Show list').then(function (yes) {
      if (!yes) return;
      B.hintsUsed += 1;
      B.palette = shuffled(Core.decode(B.m.answer).cards.map(function (c) { return c.label; }), rng(hashStr(B.m.id + ':palette')));
      renderSide('.palette button');
      say('Card list shown.');
    });
  }

  // ---------- submit and reveal ----------
  function submit() {
    if (B.result) return;
    B.pending = null; B.sel = -1; B.openPin = null;
    var ans = Core.decode(B.m.answer);
    B.answer = ans;
    var reveal = { nodes: {}, ghosts: [], context: [], edgeOk: function () { return false; } };
    var res, key = function (a, b) { return a + '\u0000' + b; };

    if (B.kind === 'map') {
      res = Core.gradeComponent(ans, B.edges);
      var exp = {};
      ans.edges.forEach(function (e) { exp[key(e.from, e.to)] = true; });
      reveal.edgeOk = function (e) { return !!exp[key(e[0], e[1])]; };
      reveal.ghosts = ans.edges.filter(function (e) { return res.missed.indexOf(e.id) >= 0; }).map(function (e) { return [e.from, e.to]; });
    } else if (B.kind === 'break') {
      res = Core.gradeBreak(ans, B.tokens);
      reveal.context = (ans.edges || []).map(function (e) { return [e.from, e.to]; });
      reveal.tokens = {};
      ans.threats.forEach(function (t) { reveal.tokens[t.id] = { card: t.card, placed: B.tokens[t.id], ok: B.tokens[t.id] === t.card }; });
    } else if (B.kind === 'lanes') {
      res = Core.gradeSwimlanes(ans, placedForLanes());
      ans.steps.forEach(function (group, g) {
        group.forEach(function (id) {
          var n = nodeById(id);
          if (!n) return;
          if (!n.placed) return; // listed in the results panel instead
          var lane = laneAt(n), missed = res.missed.indexOf(id) >= 0;
          var note = 'Step ' + (g + 1) + ' of ' + ans.steps.length;
          if (missed) reveal.nodes[id] = { cls: 'miss', good: false, note: note + ', out of order. Runs in ' + ans.lanes[id] + '.' };
          else if (lane !== ans.lanes[id]) reveal.nodes[id] = { cls: 'half', good: false, note: note + '. Half credit: runs in ' + ans.lanes[id] + '.' };
          else reveal.nodes[id] = { cls: 'ok', good: true, note: note };
        });
      });
    } else {
      var boxes = boxList();
      res = Core.gradeBoss(ans, boxes, B.edges);
      // Claude reads the payload without the page's box uids, so report wrong arrows as label pairs.
      var boxLabel = function (uid) { var n = nodeById(uid); return n ? n.label : uid; };
      res.wrong = res.wrong.map(function (w) { return [boxLabel(w[0]), boxLabel(w[1])]; });
      var map = Core.matchLabels(boxes, ans.cards), byCard = {}, exp2 = {};
      Object.keys(map).forEach(function (u) { byCard[map[u]] = u; });
      ans.edges.forEach(function (e) { exp2[key(e.from, e.to)] = true; });
      boxes.forEach(function (b) {
        var cid = map[b.uid];
        var card = ans.cards.filter(function (c) { return c.id === cid; })[0];
        reveal.nodes[b.uid] = cid ? { cls: 'ok', good: true, note: 'Matches ' + q(card.label) } : { cls: 'wrongbox', good: false, note: 'No match in this zone' };
      });
      reveal.edgeOk = function (e) { return !!(map[e[0]] && map[e[1]] && exp2[key(map[e[0]], map[e[1]])]); };
      reveal.ghosts = ans.edges.filter(function (e) { return byCard[e.from] && byCard[e.to] && res.missed.indexOf(e.id) >= 0; })
        .map(function (e) { return [byCard[e.from], byCard[e.to]]; });
    }
    B.result = res;
    B.reveal = reveal;
    B.payload = makePayload();
    renderBoardScreen();
    download(B.payload);
    var stamp = $('.stamp');
    if (stamp) stamp.focus({ preventScroll: true });
    say('Submitted. Score ' + fmt(res.got) + ' out of ' + fmt(res.of) + '. Answer saved to your Downloads folder.');
  }

  function collectText() {
    var out = {};
    Object.keys(B.text).forEach(function (k) { var v = String(B.text[k] || '').trim(); if (v) out[k] = v; });
    return out;
  }
  function makePayload() { return Core.payload(B.m.id, B.result, collectText(), B.hintsUsed, B.challenges.slice(), new Date()); }

  function download(p) {
    var blob = new Blob([JSON.stringify(p, null, 1)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: 'own-it-' + p.id + '.json', hidden: true });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  }
  function clipboardText(p) { return 'OWNIT:' + Core.toBase64(new TextEncoder().encode(JSON.stringify(p))); }
  function copyAnswer(btn) {
    var text = clipboardText(B.payload);
    function done() { btn.textContent = 'Copied. Paste it in chat'; say('Answer copied. Paste it in chat.'); }
    function manual() {
      var box = $('#copybox');
      if (!box) { box = el('textarea', { id: 'copybox', class: 'copybox mono', readonly: true, 'aria-label': 'Answer text to copy' }); btn.after(box); }
      box.value = text; box.focus(); box.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      if (ok) done(); else say('Copy the selected text and paste it in chat.');
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, manual);
    else manual();
  }

  function challenge(id, btn) {
    if (B.challenges.indexOf(id) < 0) B.challenges.push(id);
    B.payload = makePayload();
    download(B.payload);
    btn.disabled = true;
    btn.textContent = 'Challenged';
    var tip = el('span', { class: 'how' }, 'Type ', el('code', { text: 'challenge ' + id }), ' in chat. The saved answer was updated.');
    btn.after(tip);
    say('Challenge noted. Type challenge ' + id + ' in chat.');
  }

  function revealItems() {
    var ans = B.answer, res = B.result, out = [];
    var edgeLabel = function (e) { return labelOf(e.from) + ' → ' + labelOf(e.to); };
    var findEdge = function (id) { return (ans.edges || []).filter(function (e) { return e.id === id; })[0]; };
    res.missed.forEach(function (id) {
      var e = findEdge(id), label;
      if (B.kind === 'break') { var t = ans.threats.filter(function (x) { return x.id === id; })[0]; label = q(tokenById(id).label) + ' attacks ' + labelOf(t.card); }
      else if (e && (B.kind === 'map' || B.kind === 'boss')) label = 'Arrow ' + edgeLabel(e);
      else if (B.kind === 'lanes') {
        var n = nodeById(id), g = 0;
        while (g < ans.steps.length && ans.steps[g].indexOf(id) < 0) g++;
        label = labelOf(id) + ' (step ' + (g + 1) + ', ' + ans.lanes[id] + ' lane' + (n && n.placed ? ', out of order' : ', not placed') + ')';
      } else label = (B.kind === 'boss' ? 'Box ' : '') + labelOf(id);
      var node = B.kind === 'lanes' ? nodeById(id) : null;
      out.push({ kind: 'missed', id: id, label: label, ref: node && !node.placed ? node.ref : null });
    });
    (res.wrong || []).forEach(function (w) {
      if (B.kind === 'break') {
        // Every wrong threat is also missed; fold it into that row so each threat has one Challenge button.
        out.forEach(function (o) { if (o.id === w[0]) { o.kind = 'wrong'; o.label += '. You put it on ' + labelOf(w[1]); } });
      } else {
        // Boss pairs are already labels; map pairs are card ids.
        var la = B.kind === 'boss' ? w[0] : labelOf(w[0]), lb = B.kind === 'boss' ? w[1] : labelOf(w[1]);
        out.push({ kind: 'wrong', id: w[0] + '->' + w[1], label: 'Arrow ' + la + ' → ' + lb + ' is not in the code' });
      }
    });
    return out;
  }

  function renderReveal(side) {
    var res = B.result;
    side.appendChild(el('div', { class: 'stamp', tabindex: '-1' }, fmt(res.got) + ' / ' + fmt(res.of), el('small', null, res.got >= res.of && !(res.wrong && res.wrong.length) ? 'Every piece found' : 'Your score')));
    side.appendChild(el('p', { class: 'status-line', id: 'status-line', role: 'status' }));
    var items = revealItems();
    var legend = B.kind === 'lanes'
      ? 'Green cards are in order and in the right lane. Dotted green: right order, wrong lane (half credit). Red dashed: out of order. Cards you did not place are listed below.'
      : 'Green is correct. Red dashed is what the code has that you missed. Red crossed out is not in the code.';
    side.appendChild(el('p', { class: 'how', text: legend }));
    if (items.length) {
      side.appendChild(el('div', null, el('h2', null, 'To review'), el('ul', { class: 'items' }, items.map(function (it) {
        var done = B.challenges.indexOf(it.id) >= 0;
        var btn = el('button', { class: 'btn small quiet', disabled: done, onclick: function () { challenge(it.id, btn); } }, done ? 'Challenged' : 'Challenge');
        return el('li', { class: it.kind }, el('span', { text: (it.kind === 'missed' ? 'Missed: ' : 'Wrong: ') + it.label }), it.ref ? refView(it.ref) : null,
          el('div', null, btn), done ? el('span', { class: 'how' }, 'Type ', el('code', { text: 'challenge ' + it.id }), ' in chat.') : null);
      }))));
      side.appendChild(el('p', { class: 'how', text: 'Think the code says otherwise? Challenge an item and argue it in chat.' }));
    }
    if (B.kind === 'boss') {
      side.appendChild(el('div', null, el('h2', null, 'In the code'), el('ul', { class: 'items' }, B.answer.cards.map(function (c) {
        return el('li', null, el('span', { text: c.label }));
      }))));
    }
    var copyBtn = el('button', { class: 'btn', onclick: function () { copyAnswer(copyBtn); } }, 'Copy answer');
    side.appendChild(el('div', { class: 'saved' },
      el('p', null, 'Answer saved to your Downloads folder. Type ', el('b', null, 'done'), ' in chat.'),
      el('p', { class: 'how', text: 'Download blocked? Copy the answer and paste it in chat instead.' }),
      copyBtn,
      el('button', { class: 'btn quiet', onclick: backToMap }, 'Back to map')));
  }

  // ---------- global keys and resize ----------
  document.addEventListener('keydown', function (e) {
    if (!B || $('.scrim')) return;
    var typing = e.target.closest && e.target.closest('textarea, input');
    if (e.key === 'Escape') {
      if (B.pending) { B.pending = null; renderNodes(); say('Cancelled.'); }
      else if (B.sel >= 0) { B.sel = -1; drawInk(); }
      else if (B.openPin) { var id = B.openPin; B.openPin = null; renderNodes(id); }
      return;
    }
    if (!typing && B.sel >= 0 && (e.key === 'Delete' || e.key === 'Backspace')) { e.preventDefault(); removeEdge(B.sel); }
  });
  document.addEventListener('pointerdown', function (e) {
    if (!B || !canvas || B.sel < 0) return;
    if (e.target.closest('.edge-hit, .edge-x')) return;
    B.sel = -1;
    drawInk();
  });
  var resizeTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (!B || !canvas) return;
      B.nodes.forEach(function (n) { if (n.placed && B.kind !== 'lanes') clampNode(n, nodeElById(n.id)); });
      renderNodes();
    }, 120);
  });

  renderMap();
})();
</script>
</body>
</html>
